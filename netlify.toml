#  Netlify deployment for the Teedeux Mart web app.
#
#  This deploys the Vite SPA only. The API in server/ is a long-running Express
#  process backed by a SQLite file, which Netlify Functions cannot host — their
#  filesystem is ephemeral and per-invocation, so every write would be lost.
#  Deploy the API somewhere with a persistent disk (Fly.io, Railway, Render, a
#  VM) and point API_TARGET at it. See the note at the bottom of this file.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Keep devDependencies — vite and typescript live there and the build needs them.
  NPM_FLAGS = "--include=dev"

# ---------------------------------------------------------------------------
# API proxying — DISABLED until you have a deployed API
# ---------------------------------------------------------------------------
# The client calls relative /api paths, matching the Vite dev proxy, so the same
# code works in both places.
#
# Uncomment the block below and replace the host with your real API origin. Do
# NOT leave a placeholder hostname in an active rule: Netlify validates the
# redirect set at deploy time, and one unresolvable rule can invalidate the
# whole block — taking the SPA fallback with it and 404-ing every route.
#
# The rule must stay ABOVE the SPA fallback. Netlify applies rules in order, and
# the catch-all would otherwise swallow /api requests and serve index.html,
# surfacing in the client as confusing JSON parse errors.
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-api-host.example.com/api/:splat"
#   status = 200
#   force = true

# ---------------------------------------------------------------------------
# SPA fallback
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

# Vite fingerprints filenames, so assets are safe to cache indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The shell and manifest must never be cached, or a deploy won't reach clients.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

# ---------------------------------------------------------------------------
# Deploy previews
# ---------------------------------------------------------------------------
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
